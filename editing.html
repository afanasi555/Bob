<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение аудио</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Изменение аудио</h1>
        <input type="file" id="audioInput" accept="audio/*" class="file-input">
        <div class="controls">
            <label>Скорость: <input type="number" id="speedInput" min="0.5" max="2" step="0.1" value="1" class="small-input"></label>
            <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" class="slider">
            <label>Тональность: <input type="number" id="pitchInput" min="-12" max="12" step="1" value="0" class="small-input"></label>
            <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" class="slider">
            <label>Эхо: <input type="number" id="echoInput" min="0" max="1000" step="10" value="0" class="small-input"></label>
            <input type="range" id="echoSlider" min="0" max="1000" step="10" value="0" class="slider">
            <label>Реверберация: <input type="number" id="reverbInput" min="0" max="100" step="1" value="0" class="small-input"></label>
            <input type="range" id="reverbSlider" min="0" max="100" step="1" value="0" class="slider">
            <label>Флэнджер: <input type="number" id="flangerInput" min="0" max="100" step="1" value="0" class="small-input"></label>
            <input type="range" id="flangerSlider" min="0" max="100" step="1" value="0" class="slider">
            <label>Громкость: <input type="number" id="volumeInput" min="-20" max="20" step="1" value="0" class="small-input"></label>
            <input type="range" id="volumeSlider" min="-20" max="20" step="1" value="0" class="slider">
        </div>
        <div id="result" class="result">
            <audio id="editedPreview" controls></audio>
            <button onclick="playEditedPreview()">Проиграть</button>
            <button onclick="downloadEdited()">Скачать</button>
        </div>
        <a href="index.html" class="back-button">Назад</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
