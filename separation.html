<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разделение аудио</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
</head>
<body>
    <div class="container">
        <h1>Разделение аудио</h1>
        <input type="file" id="audioInput" accept="audio/*" class="file-input">
        <button id="processButton" class="button btn-blue" disabled>Начать обработку</button>
        <div id="progressText" class="progress-text">Прогресс: 0% - Ожидание загрузки библиотек</div>
        <div id="result" class="result">
            <div class="audio-section">
                <h3>Вокал</h3>
                <audio id="vocalPreview" controls></audio>
                <button onclick="playPreview('vocal')" class="btn-play btn-small btn-blue">Проиграть</button>
            </div>
            <div class="audio-section">
                <h3>Инструментал</h3>
                <audio id="instrPreview" controls></audio>
                <button onclick="playPreview('instr')" class="btn-play btn-small btn-purple">Проиграть</button>
            </div>
            <button onclick="editVocal()" class="btn-orange">Изменить вокал</button>
            <button onclick="mixResults()" class="btn-green">Смешать</button>
            <button onclick="downloadResults()" class="btn-download btn-blue">Скачать</button>
        </div>
        <a href="index.html" class="back-button">Назад</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
