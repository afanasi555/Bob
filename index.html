<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Mini App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Audio Mini App</h1>
        <div class="button-grid">
            <a href="separation.html" class="button btn-blue">Разделение аудио</a>
            <a href="mixing.html" class="button btn-purple">Смешивание аудио</a>
            <a href="conversion.html" class="button btn-green">Конвертация аудио</a>
            <a href="editing.html" class="button btn-orange">Изменение аудио</a>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker зарегистрирован:', registration);
                })
                .catch(error => {
                    console.error('Ошибка регистрации Service Worker:', error);
                });
        });
    }
</script>
</body>
</html>
