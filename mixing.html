<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смешивание аудио</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
</head>
<body>
    <div class="container">
        <h1>Смешивание аудио</h1>
        <input type="file" id="audioInput1" accept="audio/*" class="file-input">
        <input type="file" id="audioInput2" accept="audio/*" class="file-input">
        <label>Баланс (первый - второй):</label>
        <input type="range" id="mixBalance" min="-100" max="100" value="0" class="slider">
        <button id="processButton" class="button btn-purple" disabled>Начать обработку</button>
        <div id="progressText" class="progress-text">Прогресс: 0%</div>
        <div id="result" class="result">
            <audio id="mixPreview" controls></audio>
            <button onclick="playMixPreview()" class="btn-play btn-small btn-purple">Проиграть</button>
            <button onclick="downloadMix()" class="btn-download btn-green">Скачать</button>
        </div>
        <a href="index.html" class="back-button">Назад</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
