<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смешивание аудио</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Смешивание аудио</h1>
        <input type="file" id="audioInput1" accept="audio/*" class="file-input">
        <input type="file" id="audioInput2" accept="audio/*" class="file-input">
        <label>Баланс (первый файл - второй файл):</label>
        <input type="range" id="mixBalance" min="-100" max="100" value="0" class="slider">
        <div id="result" class="result">
            <audio id="mixPreview" controls></audio>
            <button onclick="playMixPreview()">Проиграть</button>
            <button onclick="downloadMix()">Скачать</button>
        </div>
        <a href="index.html" class="back-button">Назад</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
